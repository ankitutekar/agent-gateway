[project]
name = "agent-gateway"
version = "0.0.1"
description = "Governance gateway for AI agents on Azure: identity, policy, guardrails, audit"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "pyright==1.1.414",
    "pytest==9.1.1",
    "ruff==0.17.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_gateway"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", ".claude/hooks"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # import sorting
    "B",       # bugbear: likely bugs
    "UP",      # modern Python syntax
    "S",       # bandit: security issues
    "SIM",     # simplifications
    "RUF",     # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is how pytest works

[tool.pyright]
include = ["src", "tests", ".claude/hooks"]
extraPaths = ["src", ".claude/hooks"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".claude/hooks"]  # the coding-agent guard hook (ADR 0004)
addopts = "-ra --strict-markers"
